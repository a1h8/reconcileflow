[[survivor]]
function = "reconcileflow.engine._pair_reject_reason"
removed = "if abs(left.amount - right.amount) > amount_tolerance(left.amount, tol):"
added = "if abs(left.amount - right.amount) >= amount_tolerance(left.amount, tol):"
reason = "a free pair at exactly the amount limit is always matched by M2, so it never reaches the audit"
assumes = "M2 runs on every block with a free left and right, the same invariant as the unreachable return None"


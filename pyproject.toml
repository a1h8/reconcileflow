[project]
name = "reconcileflow"
version = "0.1.0"
description = "Reconciliation engine: declared rules, typed breaks, replayable decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["reconciliation", "record-matching", "audit-trail", "finance"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcileflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle — style errors
    "W",    # pycodestyle — warnings
    "F",    # pyflakes — unused imports, undefined names
    "I",    # isort — import ordering
    "UP",   # pyupgrade — syntax modernised for the target version
    "B",    # flake8-bugbear — real traps (mutable defaults, etc.)
    "SIM",  # flake8-simplify — needlessly verbose conditions and loops
    "RUF",  # Ruff's own rules (RUF013 implicit Optional, etc.)
]

# E711 (`== None` instead of `is None`) ships inside "E" and must stay enabled:
# in an engine where "absent" and "present but null" are distinct states,
# confusing equality with identity is a bug, not a style detail.

[tool.ruff.lint.per-file-ignores]
# Property-based tests deliberately construct degenerate cases.
"tests/*" = ["E501"]

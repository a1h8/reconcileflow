[project]
name = "reconcileflow"
version = "0.1.0"
description = "Reconciliation engine: declared rules, typed breaks, replayable decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["reconciliation", "record-matching", "audit-trail", "finance"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "coverage>=7.6"]
# Pinned exactly: survivors and their ids depend on mutmut's operators, and
# tools/mutation_check.py reads its internal diff helper.
mutation = ["mutmut==3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcileflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/reconcileflow"]

[tool.coverage.report]
show_missing = true
precision = 1
# A floor, not a target: raise it whenever coverage rises, never lower it to
# make a change pass.
fail_under = 98.9

# docs/mutation-testing.md: run `mutmut run`, then `python tools/mutation_check.py`.
[tool.mutmut]
source_paths = [
    "src/reconcileflow/rules.py",
    "src/reconcileflow/engine.py",
    "src/reconcileflow/m0/attribution.py",
    "src/reconcileflow/m0/stability.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
# A fixed seed: property tests then kill the same mutants on every run.
pytest_add_cli_args = ["-p", "no:cacheprovider", "--hypothesis-seed=0"]
# src/ too: mutmut copies only source_paths, and the tests import the rest of
# the package (adapters, models, provenance).
also_copy = ["src/", "m0-harness/", "examples/"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle — style errors
    "W",    # pycodestyle — warnings
    "F",    # pyflakes — unused imports, undefined names
    "I",    # isort — import ordering
    "UP",   # pyupgrade — syntax modernised for the target version
    "B",    # flake8-bugbear — real traps (mutable defaults, etc.)
    "SIM",  # flake8-simplify — needlessly verbose conditions and loops
    "RUF",  # Ruff's own rules (RUF013 implicit Optional, etc.)
]

# E711 (`== None` instead of `is None`) ships inside "E" and must stay enabled:
# in an engine where "absent" and "present but null" are distinct states,
# confusing equality with identity is a bug, not a style detail.

[tool.ruff.lint.per-file-ignores]
# Property-based tests deliberately construct degenerate cases.
"tests/*" = ["E501"]

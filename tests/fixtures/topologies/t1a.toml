# T1a: an opaque edge relay that logs its own timestamps on the shared clock,
# creates no identifier. Hardest hop relay -> ingress: derived.
[points.relay]
host = "edge"
visibility = "log"
clock = "ref-1"
timestamps = "log_ms"
inbound = ["tuple5"]
outbound = ["tuple5"]
trusts_incoming = false

[points.ingress]
host = "node-a"
visibility = "kernel"
clock = "ref-1"
timestamps = "kernel_monotonic"
inbound = ["tuple5", "h2_stream_id", "traceparent"]
outbound = ["tuple5", "h2_stream_id", "traceparent"]
propagates = { traceparent = "agent" }

[points.app]
host = "node-b"
visibility = "kernel"
clock = "ref-1"
timestamps = "kernel_monotonic"
inbound = ["tuple5", "h2_stream_id", "traceparent"]

[[hops]]
from = "relay"
to = "ingress"
nat = "snat"
pooling = true

[[hops]]
from = "ingress"
to = "app"
nat = "dnat"
nat_mapping = "conntrack"
pooling = true
